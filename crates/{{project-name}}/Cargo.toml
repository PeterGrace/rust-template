[package]
name = "{{project-name}}"
description = "{{project-name}}"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
{{project-name}}-core.workspace = true
anyhow.workspace = true
clap.workspace = true
console-subscriber = { workspace = true, optional = true }
dotenvy.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
{%- if hegel %}
hegeltest.workspace = true
{%- endif %}
nix.workspace = true

[features]
# Serves task data to `tokio-console`. Run it with `just run-tokio-console`, which also sets
# `--cfg tokio_unstable` (needed for tokio's task instrumentation) for that build only, so
# ordinary builds keep their cache and never bind the console's port (6669).
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[lints]
workspace = true
